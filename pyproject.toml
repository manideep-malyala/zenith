[project]
name = "zenith"
version = "1.0.0"
description = "Deterministic static analysis & semantic graph repository intelligence engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24.0",
    "orjson>=3.9.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
]

[project.scripts]
zenith = "cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zenith", "cli", "src", "src.core", "src.repository", "src.resolution", "src.graph", "src.graph.projections", "src.analysis", "src.analysis.predicates", "src.analysis.detectors", "src.analysis.detectors.patterns", "src.catalog", "src.pipeline", "src.output"]

[tool.setuptools.package-data]
"src" = ["catalog/*.yaml"]
"zenith" = ["catalog/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
